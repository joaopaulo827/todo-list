<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratica</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="titulo">Minhas tarefas</header>
    <main>
        <section class="formulario">
        <form method="post">
        <label for="tarefa">Tarefas:</label><p>
        <input type="text" id="tarefa" placeholder="Adicionar uma tarefa"><p>
        <button class="botao">Adicionar</button>
        <ul>
        <li>
        <p class="lista" id="lista"> Nenhuma tarefa por aqui</p>
        <button class="excluir">EXCLUIR</button>
        </li>
        </ul>
        </form>
        </section>
    </main>
</body>
<script src="js/pratica.js"></script>
</html>
